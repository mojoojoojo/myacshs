<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>myACSHS — Official Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #fff7ed; 
    --bg-2: #fffbeb; 
    --primary: #ea580c; 
    --primary-hover: #c2410c;
    --secondary: #16a34a; 
    --gold: #facc15; 
    --muted: #64748b; 
    --text: #1e293b;
    --card: #ffffff;
    --danger: #ef4444; 
    --success: #16a34a; 
    --warning: #f59e0b;
    --radius: 12px;
    --shadow: 0 4px 6px -1px rgba(234, 88, 12, 0.1), 0 2px 4px -1px rgba(234, 88, 12, 0.06);
    --header-grad: linear-gradient(135deg, #dc2626 0%, #ea580c 50%, #ca8a04 100%);
  }

  * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; font-family: 'Inter', sans-serif;
    background: var(--bg-1); color: var(--text);
    padding: 15px; display: flex; justify-content: center; min-height: 100vh;
    overflow-x: hidden;
  }

  .app { width: 100%; max-width: 1200px; display: flex; gap: 20px; flex-direction: column; }
  
  header.app-header { 
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; 
    background: var(--header-grad);
    padding: 15px 20px; border-radius: var(--radius); color: white;
    box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.3);
  }
  .brand { display: flex; gap: 12px; align-items: center; }
  .logo { 
    width: 48px; height: 48px; border-radius: 50%; 
    background: white; border: 3px solid var(--gold);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .title { font-weight: 800; font-size: 20px; text-shadow: 0 1px 2px rgba(0,0,0,0.1); } 
  .subtitle-head { color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 500; }
  .subtitle { color: var(--muted); font-size: 13px; }

  .card { 
    background: var(--card); border-radius: var(--radius); padding: 20px; 
    box-shadow: var(--shadow); border: 1px solid #fed7aa; width: 100%;
  }
  
  .center-view { display: flex; align-items: center; justify-content: center; min-height: 70vh; flex-direction: column; width: 100%; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  input, select, textarea { 
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 2px solid #fed7aa; 
    font-size: 14px; background: #fff; transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--primary); }

  .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
  label.radio-option { flex: 1; position: relative; display: block; margin: 0; cursor: pointer; }
  .radio-option input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
  .radio-option span {
    display: flex; align-items: center; justify-content: center;
    padding: 10px; border: 2px solid #fed7aa; border-radius: 8px;
    font-weight: 600; font-size: 13px; color: var(--muted);
    transition: all 0.2s; text-align: center; background: white;
  }
  .radio-option input:checked ~ span { color: white; box-shadow: 0 4px 6px -1px rgba(234, 88, 12, 0.4); transform: translateY(-2px); }
  .radio-option input[value="Present"]:checked ~ span { background: var(--secondary); border-color: var(--secondary); }
  .radio-option input[value="Absent"]:checked ~ span { background: var(--danger); border-color: var(--danger); }
  .radio-option input[value="Tardy"]:checked ~ span { background: var(--warning); border-color: var(--warning); }

  .pass-wrapper { position: relative; width: 100%; }
  .pass-wrapper input { padding-right: 40px; }
  .pass-toggle { position: absolute; right: 0; top: 0; height: 100%; width: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); }

  button { 
    padding: 12px 18px; border-radius: 8px; border: none; cursor: pointer; 
    font-weight: 700; font-size: 14px; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button.primary { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(234, 88, 12, 0.3); }
  button.primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
  button.ghost { background: transparent; border: 2px solid #fed7aa; color: var(--primary); }
  button.danger { background: #fee2e2; color: var(--danger); }
  button.danger:hover { background: var(--danger); color: white; }
  button.small { padding: 8px 12px; font-size: 12px; }

  .grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; width: 100%; } 
  @media (max-width: 900px){ .grid{ grid-template-columns: 1fr; } }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; border-bottom: 2px solid #fed7aa; margin-bottom: 16px; -webkit-overflow-scrolling: touch; } 
  .tabs button { white-space: nowrap; background: transparent; color: var(--muted); border: none; padding: 8px 14px; font-weight: 600; border-radius: 6px; } 
  .tabs button.active { background: var(--secondary); color: white; box-shadow: 0 4px 6px rgba(22, 163, 74, 0.3); }

  .table-container { 
    overflow-x: auto; -webkit-overflow-scrolling: touch; 
    border-radius: 8px; border: 1px solid #fed7aa; 
    max-width: 100%; background: white;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 700px; } 
  th, td { padding: 12px 16px; border-bottom: 1px solid #fed7aa; text-align: left; vertical-align: middle; }
  th { background: #fff7ed; color: var(--primary); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
  
  @media (max-width: 700px){
    table, thead, tbody, th, td, tr { display: block; width: 100%; min-width: 0; }
    thead { display: none; } 
    .table-container { border: none; background: transparent; }
    tr { background: var(--card); margin-bottom: 15px; border: 1px solid #fed7aa; border-radius: 12px; padding: 15px; box-shadow: var(--shadow); position: relative; }
    td { padding: 8px 0; border: none; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #fee2e2; text-align: right; }
    td:last-child { border-bottom: none; justify-content: flex-end; padding-top: 15px; }
    td::before { content: attr(data-label); font-weight: 700; color: var(--primary); font-size: 12px; text-transform: uppercase; margin-right: 15px; text-align: left; }
    .table-pic { width: 40px; height: 40px; }
  }

  .pill { background: #fff7ed; color: var(--primary); padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid #fed7aa; display: inline-block; }
  .hr { height: 1px; background: #fed7aa; margin: 16px 0; width: 100%; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; } 
  .col { flex: 1; min-width: 180px; }

  .profile-pic { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--gold); object-fit: cover; background: #eee; display: block; margin: 0 auto 15px; }
  .table-pic { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px; background: #eee; border: 1px solid #fed7aa; }
  
  .fade-in { animation: fadeIn 0.4s ease forwards; opacity: 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .link-btn { background: none; border: none; color: var(--primary); text-decoration: underline; padding: 0; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="logo">
        <img src="acshslogo.jpg" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" alt="ACSHS Logo">
      </div>
      <div><div class="title">Antipolo City SHS</div><div class="subtitle-head">Official Portal</div></div>
    </div>
  </header>

  <main id="loginView" class="center-view fade-in">
    <div class="card" style="max-width: 400px; border-top: 5px solid var(--primary);">
      <h2 style="margin: 0 0 10px 0; text-align: center; color: var(--primary);">Welcome Back</h2>
      <p style="text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px;">Sign in with Username or LRN</p>

      <label>Role</label>
      <select id="loginRole" style="margin-bottom: 16px;">
        <option value="student">Student</option>
        <option value="admin">Administrator</option>
      </select>

      <label>Username or LRN</label>
      <input id="loginId" type="text" placeholder="Enter ID or Username" style="margin-bottom: 16px;">

      <label>Password</label>
      <div class="pass-wrapper" style="margin-bottom: 20px;">
        <input id="loginPass" type="password" placeholder="••••••••">
        <div class="pass-toggle" onclick="togglePass('loginPass')">👁️</div>
      </div>

      <button class="primary" onclick="login()" style="width: 100%;">Sign In</button>
      
      <div style="margin-top: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px;">
        <button class="link-btn" onclick="showRegister()">No account? Register here</button>
        <button class="link-btn" onclick="showForgotPass()">Forgot Password?</button>
      </div>
    </div>
  </main>

  <main id="registerView" class="center-view fade-in" style="display:none">
    <div class="card" style="max-width: 500px; border-top: 5px solid var(--secondary);">
      <h2 style="text-align: center; color: var(--secondary); margin-bottom: 10px;">Student Registration</h2>
      <p style="text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 20px;">Create your official portal account</p>

      <div class="row">
        <div class="col"><label>Username</label><input id="regUn" placeholder="e.g. juan.dc"></div>
        <div class="col"><label>LRN (12-digit ID)</label><input id="regLrn" placeholder="136694..."></div>
      </div>
      <div class="row" style="margin-top: 10px;">
        <div class="col"><label>First Name</label><input id="regFn"></div>
        <div class="col"><label>Last Name</label><input id="regLn"></div>
      </div>
      <div class="row" style="margin-top: 10px;">
        <div class="col"><label>Email Address</label><input id="regEm" type="email" placeholder="student@email.com"></div>
        <div class="col">
          <label>Section</label>
          <select id="regSec">
            <option value="ICT-1201">ICT-1201</option>
            <option value="ICT-1202">ICT-1202</option>
            <option value="ICT-1203">ICT-1203</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top: 10px;">
        <div class="col"><label>Password</label><input id="regPw" type="password"></div>
      </div>

      <button class="primary" onclick="handleRegister()" style="width: 100%; margin-top: 20px; background: var(--secondary);">Create Account</button>
      <button class="ghost" onclick="showLogin()" style="width: 100%; margin-top: 10px;">Already have an account? Login</button>
    </div>
  </main>

  <main id="forgotView" class="center-view fade-in" style="display:none">
    <div class="card" style="max-width: 400px;">
      <h2 style="margin: 0 0 8px 0; text-align: center; color: var(--primary);">Reset Password</h2>
      <label>Username or LRN</label>
      <input id="recId" type="text" style="margin-bottom: 16px;">
      <label>New Password</label>
      <div class="pass-wrapper" style="margin-bottom: 24px;">
        <input id="recNewPass" type="password">
        <div class="pass-toggle" onclick="togglePass('recNewPass')">👁</div>
      </div>
      <button class="primary" onclick="processReset()" style="width: 100%;">Save New Password</button>
      <button class="ghost" onclick="showLogin()" style="width: 100%; margin-top:8px">Back</button>
    </div>
  </main>

  <section id="dashboardView" style="display:none" class="fade-in">
    <div class="grid">
      <div style="min-width: 0;"> 
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
            <div>
              <div id="userTitle" style="font-weight:800; font-size:24px; color: var(--primary);">...</div>
              <div id="userMeta" class="subtitle" style="font-weight: 500;">...</div>
            </div>
            <button class="danger ghost" onclick="logout()">Logout</button>
          </div>
          <div id="tabsArea" class="tabs"></div>
          <div id="mainArea" class="fade-in"></div>
        </div>
      </div>
      <aside>
        <div class="card" style="background: var(--bg-1);">
          <div class="subtitle" style="text-transform: uppercase; font-weight: 800; color: var(--primary);">Portal Stats</div>
          <div style="font-weight:700; font-size: 18px; margin: 8px 0;" id="todayDate"></div>
          <div class="hr"></div>
          <div id="quickPills" style="display:flex; gap:8px; flex-wrap:wrap"></div>
        </div>
      </aside>
    </div>
  </section>
</div>

<input type="file" id="adminPicInput" style="display:none" accept="image/*" onchange="processAdminPic(this)">

<script>
const KEYS = { USERS:'ac_user_db_v12', ATT:'ac_att_db_v12', GRADES:'ac_grade_db_v12', SCHED:'ac_sched_db_v12', SESSION: 'ac_session_v12' };
const ADMIN = { username:'admin', password:'admin123' };
const SUBJECTS = ['M.I.L', 'JAVA', 'P.E', 'TRIPLE III', 'WORK IMMERSION'];

function read(key){ try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e){ return []; } }
function write(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let state = { role: null, user: null };
let targetedUserLrn = null; 
let editIndex = -1;
let editGradeIndex = -1;

function initData(){
  let users = read(KEYS.USERS);
  if(users.length === 0){
    users.push({ 
      lrn: '123456789', username: 'student.demo', email: 'demo@acshs.edu.ph',
      password: 'password', firstName: 'Juan', lastName: 'Dela Cruz', section: 'ICT-1202', pic: ''
    });
    write(KEYS.USERS, users);
  }

  let sched = read(KEYS.SCHED);
  if(sched.length === 0){
    const newSched = [
      { subject: "Homeroom Guidance", time: "Mon 06:15", teacher: "Adviser" },
      { subject: "M.I.L", time: "Tue 06:15", teacher: "Mrs. Sofia" }
    ];
    write(KEYS.SCHED, newSched);
  }
}

function togglePass(id){ const el = document.getElementById(id); el.type = el.type === 'password' ? 'text' : 'password'; }
function showRegister(){ loginView.style.display='none'; forgotView.style.display='none'; registerView.style.display='flex'; }
function showForgotPass(){ loginView.style.display='none'; registerView.style.display='none'; forgotView.style.display='flex'; }
function showLogin(){ registerView.style.display='none'; forgotView.style.display='none'; loginView.style.display='flex'; }

function handleRegister(){
  const un = document.getElementById('regUn').value.trim();
  const lrn = document.getElementById('regLrn').value.trim();
  const fn = document.getElementById('regFn').value.trim();
  const ln = document.getElementById('regLn').value.trim();
  const em = document.getElementById('regEm').value.trim();
  const sec = document.getElementById('regSec').value;
  const pw = document.getElementById('regPw').value;
  if(!un || !lrn || !em || !pw) return alert('Username, LRN, Email, and Password are required.');
  let db = read(KEYS.USERS);
  if(db.find(x => x.username === un || x.lrn === lrn)) return alert('Username or LRN is already registered.');
  db.push({ username: un, lrn: lrn, email: em, firstName: fn, lastName: ln, section: sec, password: pw, pic: '' });
  write(KEYS.USERS, db);
  alert('Registration Successful!');
  showLogin();
}

function login(){
  const role = document.getElementById('loginRole').value;
  const idInput = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value.trim();

  // ADMIN LOGIN
  if(role === 'admin'){
    if(idInput !== ADMIN.username){
      alert("Admin Username not found.");
      return;
    }
    if(pass !== ADMIN.password){
      alert("Incorrect Admin Password.");
      return;
    }
    saveSession('admin', { username: 'Admin' });
    return;
  }

  // STUDENT LOGIN
  const users = read(KEYS.USERS);
  const u = users.find(x => x.lrn === idInput || x.username === idInput);

  if(!u){
    alert("Username or LRN not found.");
    return;
  }
  
  if(pass !== u.password){
    alert("Incorrect Password.");
    return;
  }

  saveSession('student', u);
}

function saveSession(role, user){
  state = { role, user };
  localStorage.setItem(KEYS.SESSION, JSON.stringify(state));
  openDashboard();
}

function logout(){ localStorage.removeItem(KEYS.SESSION); location.reload(); }

function processReset(){
  const idVal = document.getElementById('recId').value.trim();
  const users = read(KEYS.USERS);
  const idx = users.findIndex(u => u.lrn === idVal || u.username === idVal);
  if(idx > -1){
    users[idx].password = document.getElementById('recNewPass').value;
    write(KEYS.USERS, users);
    alert('Password updated!');
    showLogin();
  } else { alert('User not found'); }
}

const loginView = document.getElementById('loginView');
const registerView = document.getElementById('registerView');
const forgotView = document.getElementById('forgotView');
const dashboardView = document.getElementById('dashboardView');
const tabsArea = document.getElementById('tabsArea');
const mainArea = document.getElementById('mainArea');

function openDashboard(){
  loginView.style.display = 'none';
  registerView.style.display = 'none';
  forgotView.style.display = 'none';
  dashboardView.style.display = 'block';
  document.getElementById('todayDate').innerText = new Date().toDateString();
  if(state.role === 'admin'){
    document.getElementById('userTitle').innerText = 'Administrator';
    buildAdminTabs();
  } else {
    const fresh = read(KEYS.USERS).find(x => x.lrn === state.user.lrn);
    state.user = fresh;
    document.getElementById('userTitle').innerText = `${state.user.firstName} ${state.user.lastName}`;
    document.getElementById('userMeta').innerText = `@${state.user.username} | ${state.user.section}`;
    buildStudentTabs();
  }
  updateSidebar();
}

function updateSidebar(){
  const pills = document.getElementById('quickPills');
  pills.innerHTML = '';
  if(state.role === 'admin') pills.innerHTML = `<div class="pill">${read(KEYS.USERS).length} Students</div>`;
  else pills.innerHTML = `<div class="pill">${read(KEYS.ATT).filter(a=>a.lrn===state.user.lrn && a.status==='Absent').length} Absences</div>`;
}

function buildAdminTabs(){
  tabsArea.innerHTML = '';
  const t = [{n:'Students', f:renderManageStudents}, {n:'Attendance', f:renderAdminAttendance}, {n:'Grades', f:renderAdminGrades}, {n:'Schedule', f:renderAdminSchedule}];
  t.forEach((x, i) => addTabBtn(x.n, i===0, x.f));
}

function buildStudentTabs(){
  tabsArea.innerHTML = '';
  const t = [{n:'Profile', f:renderStudentProfile}, {n:'Schedule', f:renderStudentSchedule}, {n:'Attendance', f:renderStudentAttendance}, {n:'Grades', f:renderStudentGrades}];
  t.forEach((x, i) => addTabBtn(x.n, i===0, x.f));
}

function addTabBtn(name, active, func){
  const b = document.createElement('button');
  b.innerText = name;
  if(active) { b.classList.add('active'); func(); }
  b.onclick = () => {
    Array.from(tabsArea.children).forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    func();
  };
  tabsArea.appendChild(b);
}

/* --- ADMIN FUNCTIONS --- */
function renderManageStudents(){
  const users = read(KEYS.USERS);
  const rows = users.map((u, i) => `
    <tr>
      <td data-label="Account">
        <div style="display:flex; align-items:center;">
          <img src="${u.pic || 'https://via.placeholder.com/150'}" class="table-pic">
          <div>
             <div><strong>@${u.username}</strong></div>
             <div style="font-size:11px; color:var(--muted)">${u.firstName} ${u.lastName}</div>
          </div>
        </div>
      </td>
      <td data-label="Email">${u.email}</td>
      <td data-label="LRN">${u.lrn}</td>
      <td data-label="Section"><span class="pill">${u.section}</span></td>
      <td data-label="Actions">
        <div style="display:flex; gap:5px; justify-content: flex-end;">
          <button class="primary ghost small" onclick="editStudent(${i})">Edit</button>
          <button class="primary ghost small" onclick="triggerPicUpload('${u.lrn}')">Photo</button>
          <button class="danger small" onclick="delStudent(${i})">Del</button>
        </div>
      </td>
    </tr>`).join('');
    
  mainArea.innerHTML = `
    <div class="fade-in">
      <h3>Student Management</h3>
      <div id="editForm" class="card" style="background:var(--bg-2); margin-bottom:20px; display:none;">
        <h4 id="formLabel">Edit Student</h4>
        <div class="row">
          <div class="col"><label>First Name</label><input id="efn"></div>
          <div class="col"><label>Last Name</label><input id="eln"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div class="col"><label>Email</label><input id="eem"></div>
          <div class="col">
            <label>Section</label>
            <select id="esec">
              <option value="ICT-1201">ICT-1201</option>
              <option value="ICT-1202">ICT-1202</option>
              <option value="ICT-1203">ICT-1203</option>
            </select>
          </div>
        </div>
        <div style="margin-top:15px; display:flex; gap:10px;">
          <button class="primary" onclick="saveStudentEdit()">Update Record</button>
          <button class="ghost" onclick="document.getElementById('editForm').style.display='none'">Cancel</button>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead><tr><th>Account</th><th>Email</th><th>LRN</th><th>Section</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function editStudent(i){
  editIndex = i;
  const u = read(KEYS.USERS)[i];
  document.getElementById('editForm').style.display = 'block';
  document.getElementById('efn').value = u.firstName;
  document.getElementById('eln').value = u.lastName;
  document.getElementById('eem').value = u.email;
  document.getElementById('esec').value = u.section;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function saveStudentEdit(){
  let db = read(KEYS.USERS);
  db[editIndex].firstName = document.getElementById('efn').value;
  db[editIndex].lastName = document.getElementById('eln').value;
  db[editIndex].email = document.getElementById('eem').value;
  db[editIndex].section = document.getElementById('esec').value;
  write(KEYS.USERS, db);
  alert('Student details successfully updated!'); // Notify Message
  renderManageStudents();
}

function triggerPicUpload(lrn){ targetedUserLrn = lrn; document.getElementById('adminPicInput').click(); }

function processAdminPic(input){
  if(input.files && input.files[0]){
    const reader = new FileReader();
    reader.onload = function(e){
      let users = read(KEYS.USERS);
      const idx = users.findIndex(u => u.lrn === targetedUserLrn);
      if(idx > -1){
        users[idx].pic = e.target.result;
        write(KEYS.USERS, users);
        alert('Student photo updated!');
        renderManageStudents();
      }
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function delStudent(i){ if(confirm('Remove student?')){ const db=read(KEYS.USERS); db.splice(i,1); write(KEYS.USERS,db); renderManageStudents(); updateSidebar(); } }

function renderAdminAttendance(){
  const users = read(KEYS.USERS), logs = read(KEYS.ATT);
  const rows = logs.slice().reverse().map(l => `<tr><td data-label="LRN">${l.lrn}</td><td data-label="Date">${l.date}</td><td data-label="Status"><span class="pill" style="background:${l.status==='Tardy'?'#fef3c7':''}">${l.status}</span></td></tr>`).join('');
  mainArea.innerHTML = `
    <div class="fade-in">
      <h3>Attendance Entry</h3>
      <div class="card" style="background:var(--bg-2); margin-bottom:20px">
        <label>Student</label>
        <select id="aLrn">${users.map(u=>`<option value="${u.lrn}">${u.lastName}, ${u.firstName}</option>`).join('')}</select>
        <label style="margin-top:10px">Status</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="st" value="Present" checked><span>Present</span></label>
          <label class="radio-option"><input type="radio" name="st" value="Tardy"><span>Tardy</span></label>
          <label class="radio-option"><input type="radio" name="st" value="Absent"><span>Absent</span></label>
        </div>
        <button class="primary" onclick="doAddAtt()" style="width:100%; margin-top:15px">Log Attendance</button>
      </div>
      <div class="table-container"><table><thead><tr><th>LRN</th><th>Date</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
}
function doAddAtt(){
  const db=read(KEYS.ATT); db.push({lrn:document.getElementById('aLrn').value, date:new Date().toLocaleDateString(), status:document.querySelector('input[name="st"]:checked').value});
  write(KEYS.ATT, db); renderAdminAttendance(); updateSidebar();
}

function renderAdminGrades(){
  const users = read(KEYS.USERS), grades = read(KEYS.GRADES);
  
  const rows = grades.map((g, i) => `
    <tr>
      <td data-label="LRN">${g.lrn}</td>
      <td data-label="Subject">${g.subject}</td>
      <td data-label="Grade">${g.grade}</td>
      <td data-label="Actions">
        <div style="display:flex; gap:5px; justify-content: flex-end;">
          <button class="primary ghost small" onclick="editGrade(${i})">Edit</button>
          <button class="danger small" onclick="delGrade(${i})">Del</button>
        </div>
      </td>
    </tr>`).join('');

  const isEditing = editGradeIndex > -1;
  const btnText = isEditing ? 'Update Grade' : 'Save Grade';
  const cancelBtn = isEditing ? `<button class="ghost" onclick="cancelGradeEdit()" style="width:100%; margin-top:8px">Cancel Edit</button>` : '';
  const formTitle = isEditing ? 'Edit Existing Grade' : 'Grade Input';
  const formColor = isEditing ? 'border-top: 3px solid var(--warning);' : '';

  mainArea.innerHTML = `
    <div class="fade-in">
      <h3>Grade Management</h3>
      <div class="card" style="background:var(--bg-2); margin-bottom:20px; ${formColor}">
        <h4 style="margin:0 0 10px 0; color:var(--primary)">${formTitle}</h4>
        <select id="gLrn">${users.map(u=>`<option value="${u.lrn}">${u.lastName}, ${u.firstName}</option>`).join('')}</select>
        <select id="gSub" style="margin-top:10px">${SUBJECTS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
        <input id="gVal" type="number" placeholder="Grade" style="margin-top:10px">
        <button class="primary" onclick="doSaveGrade()" style="width:100%; margin-top:15px">${btnText}</button>
        ${cancelBtn}
      </div>
      <div class="table-container">
        <table>
          <thead><tr><th>LRN</th><th>Subject</th><th>Grade</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;

  if(isEditing){
    const g = grades[editGradeIndex];
    if(g){
      document.getElementById('gLrn').value = g.lrn;
      document.getElementById('gSub').value = g.subject;
      document.getElementById('gVal').value = g.grade;
    }
  }
}

function doSaveGrade(){
  const lrn = document.getElementById('gLrn').value;
  const sub = document.getElementById('gSub').value;
  const val = document.getElementById('gVal').value;

  if(!val) return alert("Please enter a grade");

  const db = read(KEYS.GRADES);

  if(editGradeIndex > -1) {
    db[editGradeIndex] = { lrn, subject: sub, grade: val };
    alert("Grade successfully updated!"); // Notify Message
    editGradeIndex = -1; 
  } else {
    db.push({ lrn, subject: sub, grade: val });
  }
  
  write(KEYS.GRADES, db);
  renderAdminGrades();
}

function editGrade(i){
  editGradeIndex = i;
  renderAdminGrades();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelGradeEdit(){
  editGradeIndex = -1;
  renderAdminGrades();
}

function delGrade(i){
  if(confirm("Are you sure you want to delete this grade?")){
    const db = read(KEYS.GRADES);
    db.splice(i, 1);
    write(KEYS.GRADES, db);
    if(editGradeIndex === i) editGradeIndex = -1;
    renderAdminGrades();
  }
}

function renderAdminSchedule(){
  const sched = read(KEYS.SCHED);
  const rows = sched.map((s, i) => `<tr><td data-label="Subject">${s.subject}</td><td data-label="Time">${s.time}</td><td data-label="Teacher">${s.teacher}</td><td data-label="Action"><button class="danger small" onclick="delSch(${i})">X</button></td></tr>`).join('');
  mainArea.innerHTML = `
    <div class="fade-in">
      <h3>Schedule Setup</h3>
      <div class="card" style="background:var(--bg-2); margin-bottom:20px">
        <label>Subject</label>
        <select id="sSub">
          ${SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join('')}
        </select>
        <label style="margin-top:10px">Calendar & Time</label>
        <input id="sTim" type="datetime-local">
        <label style="margin-top:10px">Teacher Name</label>
        <input id="sTea" placeholder="e.g. Mrs. Sofia">
        <button class="primary" onclick="doAddSch()" style="width:100%; margin-top:15px">Add Subject</button>
      </div>
      <div class="table-container"><table><thead><tr><th>Subject</th><th>Time</th><th>Teacher</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
}
function doAddSch(){
  const dateVal = document.getElementById('sTim').value;
  if(!dateVal) return alert('Please select a date and time.');
  const formattedTime = new Date(dateVal).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const db=read(KEYS.SCHED); 
  db.push({subject:document.getElementById('sSub').value, time:formattedTime, teacher:document.getElementById('sTea').value});
  write(KEYS.SCHED, db); renderAdminSchedule();
}
function delSch(i){ if(confirm('Remove schedule?')){ const db=read(KEYS.SCHED); db.splice(i,1); write(KEYS.SCHED,db); renderAdminSchedule(); } }

window.onload = () => {
  initData(); 
  const saved = localStorage.getItem(KEYS.SESSION);
  if(saved){ state = JSON.parse(saved); openDashboard(); }
};
